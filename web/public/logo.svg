<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Mission Control — self-custody AI trading agent">
  <title>Mission Control</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#1A1D23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>

  <!-- banner -->
  <rect x="1" y="1" width="998" height="198" rx="26" fill="url(#bg)" stroke="#7C5CFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- mark: a "mission control" regime dial reading a mean-reverting signal -->
  <g>
    <!-- gauge arc, open at the bottom -->
    <path d="M87.65 136 A72 72 0 1 1 212.35 136" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
    <!-- proof tick at the dial crown (verifiable-data marker) -->
    <circle cx="150" cy="37" r="6" fill="url(#accent)"/>
    <!-- the mean line (the level mean-reversion pulls back to) -->
    <line x1="102" y1="100" x2="200" y2="100" stroke="#5E6673" stroke-width="2" stroke-dasharray="4 5"/>
    <!-- the signal: dips below the mean (oversold), reverts back through it -->
    <path d="M102 92 C116 94 122 124 136 121 C150 118 154 84 168 83 C181 82 190 94 200 92"
          fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the buy-the-oversold-trough marker -->
    <circle cx="136" cy="121" r="6.5" fill="#0B0E11" stroke="url(#accent)" stroke-width="3"/>
  </g>

  <!-- wordmark -->
  <text x="288" y="90" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#EAECEF">Mission Control</tspan>
  </text>
  <text x="290" y="123" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#9AA4B2">Self-custody AI trading agent · regime-adaptive, mean-reversion live arm</text>
  <text x="291" y="150" font-family="ui-monospace, Menlo, monospace" font-size="15.5" font-weight="600" fill="#7C5CFF" letter-spacing="0.4">x402  ·  ERC-8004  ·  ERC-8183   —   verifiable via vlayer</text>
</svg>
